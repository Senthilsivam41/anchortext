[project]
name = "anchortext"
version = "0.1.0"
description = "Billable oriented engineering-text annotation service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2",
    "sqlalchemy>=2",
    "rapidfuzz>=3",
    "opencv-python-headless>=4.10",
    "numpy>=2",
    "python-multipart>=0.0.12",
    "jinja2>=3.1",
    "boto3>=1.35",
]

[project.optional-dependencies]
ocr = ["paddleocr>=3"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html"]
